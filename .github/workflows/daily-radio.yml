name: daily-radio

on:
  schedule:
    # GitHub Actionsのscheduleは実測で毎回3〜5時間遅延する（定刻に動いた日が無い）。
    # 遅延しても通勤時刻までに1本通るよう、JST 0:07〜3:07に4本仕掛ける。
    # 本日分が配信済みなら src/run_daily.py が即スキップするので、
    # 2本目以降が動いてもClaude APIとActions分数は消費しない。
    - cron: "7 15 * * *"   # JST 0:07
    - cron: "7 16 * * *"   # JST 1:07
    - cron: "7 17 * * *"   # JST 2:07
    - cron: "7 18 * * *"   # JST 3:07
  workflow_dispatch: {}      # 手動実行（テスト用）

permissions:
  contents: write

concurrency:
  group: radio
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: 過去エピソード取得（gh-pages。初回は存在しないのでスキップ可）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - name: siteの.gitを除去
        run: rm -rf site/.git || true

      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存インストール
        run: pip install -r requirements.txt

      - name: 声エンジンのキャッシュ
        uses: actions/cache@v4
        with:
          path: |
            .engine
            ~/.local/share/AivisSpeech-Engine
            ~/.cache/huggingface
          key: tts-engine-v1-${{ hashFiles('scripts/start_engine.sh') }}

      - name: 7z・ffmpegの存在を保証
        run: sudo apt-get update && sudo apt-get install -y p7zip-full ffmpeg

      - name: 声エンジン起動
        run: |
          ENGINE=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['tts']['engine'])")
          echo "engine=$ENGINE"
          bash scripts/start_engine.sh "$ENGINE"

      - name: 収録（ニュース→台本→音声→配信ファイル生成）
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          export SITE_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          python -m src.run_daily

      - name: 静的ページをsiteへ配置
        # site/ は gh-pages をチェックアウトして作るため、main側の site/ に置いたファイルは
        # 残らない。Google OAuth の必須項目であるプライバシーポリシー・利用規約は
        # site_static/ に置き、デプロイ直前にここでコピーする。
        run: cp -a site_static/. site/

      - name: 配信（GitHub Pagesへデプロイ）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true    # 履歴を常に1コミットに保ち、リポジトリ肥大を防ぐ
          commit_message: "broadcast ${{ github.run_id }}"
