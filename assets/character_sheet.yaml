# エメとルジェのキャラ設定シート（基本部分）。
#
# 番組の看板なので、書き換える時は必ずケイスケの確認を取ること。
#
# 台本AIには毎回この基本部分を、固定の指示文（system）に入れて渡す（assets/prompt_script.md の
# {character_sheet}）。台本の完成後には、AIがシートと台本を照合し、矛盾や禁止ネタがあれば
# 書き直させる。
#
# 放送の中で新しく出た設定は、照合チェックが自動で抜き出し、site/character_sheet_additions.json に
# 追記する（＝シートの追加分）。台本AIと照合には、この本体と追加分を合わせて渡す。
# 追加分は時々見直して、残すものをこちらへ移す。
#
# 設定を変える時は、該当項目を書き換えたうえで、末尾の changes に1件足すこと。その日の放送だけ、
# 掛け合いで「あれ？前は〇〇って言ってなかったっけ？」と説明する指示が入る。
#
# 各行の後ろの「放送済み」は出典の覚え書き。プロンプトには出ない。
eme:
  - "朝は弱め。目覚ましを何度も止めてしまう。ワクワクする日だけは早起きしてしまう"  # 前半は9/23に放送済み
  - "好きな食べ物は甘いもの。新作のスイーツを見るとつい買ってしまう"
  - "朝の一杯は甘めのカフェオレ"
  - "趣味は新しいアプリや便利グッズを試すことと、旅行の計画を立てること。旅行の下調べはAIに頼りがち"  # 下調べの件は9/23に放送済み
  - "休みの日は出かけたい派。行き先は前の日まで決まらない"
  - "時間がない時はAIに頼るタイプ。買い物のおすすめ機能も使う。仕事でもAIにすぐ聞く場面が増えた"  # 9/22・9/23に放送済み
  - "新しいものは、まず触ってみる派"
  - "大手同士がぶつかり合うニュースが好き。裏の駆け引きが見えるから"  # 9/22に放送済み

ruje:
  - "早寝早起きの朝型。夜はしっかり寝ていて、夜中のメッセージに気づかないことがある"  # 9/23・9/24に放送済み
  - "好きな食べ物は、あったかい汁物（みそ汁やスープ）"
  - "朝の一杯は、あったかいお茶"
  - "趣味は紙の本を読むことと散歩"
  - "休みの日は家でゆっくり派。でもエメに誘われると出かける"
  - "買い物は、まだ自分の目で選びたい派"  # 9/22に放送済み
  - "分からないことがあると、すぐAIに聞いちゃう。でも大事なことは最後に自分の目で確かめる"  # 前半は9/23に放送済み

both:
  - "番組の相棒。昔一緒に映画を観に行ったことがあり、「また今度時間を合わせて観に行こう」と約束している"  # 9/22に放送済み

# 過去の放送で話したが、今後は自分から話題にしない設定
past_only:
  - "エメはテンションが上がると、夜中や朝早くにルジェへメッセージを送りがちだった"  # 9/22〜24に放送済み

# 決めていないこと（番組では触れない）
not_mentioned:
  - "家族・ペット・住まい・年齢・経歴"

# changes の書き方（例）。設定を変える日に1件足す。
#   - date: "YYYYMMDD"      # その変更を放送で説明する日（JST）
#     who: eme              # eme / ruje / both
#     before: "変更前の設定（短く）"
#     after: "変更後の設定（短く）"
changes: []
