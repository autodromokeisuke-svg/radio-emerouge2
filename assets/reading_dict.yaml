# 音声合成の読み間違い対策・辞書登録リスト。
#
# AivisSpeech Engine起動のたびに、ここに載せた全項目をエンジンのユーザー辞書へ
# 登録し直す（src/tts/vv_compat.py の prepare() から呼ばれる）。CIは毎回エンジン
# を新規ダウンロードして起動する設計のため辞書は空の状態から始まり、手元のPCで
# AivisSpeechアプリへ手動登録してもCI側には一切反映されない。このファイルに
# 書いておくことが唯一の永続化手段。
#
# なぜ台本側のテキスト置換（build_audio.py の _KNOWN_MISREADINGS）ではなく
# エンジンのユーザー辞書を使うか:
#   「次」のような1文字の語は、テキストを単純置換すると「次官」「次期」
#   「次男」「次いで」のような複合語まで巻き込んで壊れる。エンジンの形態素解析
#   （最長一致）にまかせれば、これらの既存の複合語エントリが優先され、
#   単独で出現した「次」だけを正しく読ませられる（実機確認済み）。
#
# 項目追加の指針:
#   - 実際に誤読が発生した語だけを足す（先回りで大量に登録しない）
#   - 追加前に、tools/audition.py 等でエンジンへ実際に問い合わせて
#     「直ったか」「巻き込みで壊れる複合語が無いか」を実機確認すること
#   - accent_typeは、正しく読めている文脈のaudio_query結果を参考に決める
#
# 各項目のフィールド:
#   surface:       表記（そのままの文字列）
#   pronunciation: 読み（カタカナ。長音は「ー」で表記）
#   accent_type:   アクセント核の位置（0=平板）
#   word_type:     品詞。COMMON_NOUN=普通名詞 / PROPER_NOUN=固有名詞（省略時PROPER_NOUN）

words:
  - surface: "次"
    pronunciation: "ツギ"
    accent_type: 0
    word_type: "COMMON_NOUN"
    # 2026-09-12発覚: 「さて、次の」の並びでのみ「じ」と誤読されていた
    # （「次、」「次は」「次にいきましょう」等、他の文脈は元々正しく読めていた）。
    # 登録後、「次官」→ジカン／「次期」→ジキ／「次男」→ジナン／「次いで」→ツイデ
    # がいずれも登録前と変わらず正しいまま読めることを実機確認済み。

  - surface: "花王"
    pronunciation: "カオー"
    accent_type: 0
    word_type: "PROPER_NOUN"
    # 2026-09-01放送分で発覚: 助詞「の」に続く文脈（「花王のニュースです」）で
    # 「はなおう」と誤読されていた（「花王が」に続く文脈は元々正しく読めていた）。
