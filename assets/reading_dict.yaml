# 音声合成の読み間違い対策・辞書登録リスト。
#
# AivisSpeech Engine起動のたびに、ここに載せた全項目をエンジンのユーザー辞書へ
# 登録し直す（src/tts/vv_compat.py の prepare() から呼ばれる）。CIは毎回エンジン
# を新規ダウンロードして起動する設計のため辞書は空の状態から始まり、手元のPCで
# AivisSpeechアプリへ手動登録してもCI側には一切反映されない。このファイルに
# 書いておくことが唯一の永続化手段。
#
# 注意: この同期はCI（環境変数 GITHUB_ACTIONS=true）でしか自動実行されない。
# ローカルPC（tools/audition.py・tools/bgm_preview.py等）で実行すると、ケイスケが
# AivisSpeechアプリへ手で育てた個人辞書を書き換えてしまうため、既定でスキップ
# される（2026-09-25対応）。ローカルで同期を試したい場合だけ環境変数
# RADIO_SYNC_READING_DICT=1 を付けて実行すること。
#
# なぜ台本側のテキスト置換（build_audio.py の _KNOWN_MISREADINGS）ではなく
# エンジンのユーザー辞書を使うか:
#   「次」のような1文字の語は、テキストを単純置換すると「次官」「次期」
#   「次男」「次いで」のような複合語まで巻き込んで壊れる。エンジンの形態素解析
#   （最長一致）にまかせれば、これらの既存の複合語エントリが優先され、
#   単独で出現した「次」だけを正しく読ませられる（実機確認済み）。
#
# 項目追加の指針:
#   - 実際に誤読が発生した語だけを足す（先回りで大量に登録しない）
#   - 追加前に、tools/audition.py 等でエンジンへ実際に問い合わせて
#     「直ったか」「巻き込みで壊れる複合語が無いか」を実機確認すること
#   - accent_typeは、正しく読めている文脈のaudio_query結果を参考に決める
#
# 各項目のフィールド:
#   surface:       表記（そのままの文字列）
#   pronunciation: 読み（カタカナ。長音は「ー」で表記）
#   accent_type:   アクセント核の位置（0=平板）
#   word_type:     品詞。COMMON_NOUN=普通名詞 / PROPER_NOUN=固有名詞（省略時PROPER_NOUN）

words:
  - surface: "次"
    pronunciation: "ツギ"
    accent_type: 0
    word_type: "COMMON_NOUN"
    # 2026-09-12発覚: 「さて、次の」の並びでのみ「じ」と誤読されていた
    # （「次、」「次は」「次にいきましょう」等、他の文脈は元々正しく読めていた）。
    # 登録後、「次官」→ジカン／「次期」→ジキ／「次男」→ジナン／「次いで」→ツイデ
    # がいずれも登録前と変わらず正しいまま読めることを実機確認済み。
    #
    # 2026-09-25追記: このエントリ（priority 8）が「副次的な副作用について」の
    # ような文脈で「副次的」の読みを巻き込んで壊す（フクツギテキと誤読させる）
    # ことが判明した（「次」を一時的に削除すると直ることを実機確認）。対策として
    # 「副次的」をpriority 9で個別登録し、この「次」エントリより優先させた
    # （下の「副次的」エントリ参照）。この「次」エントリ自体は変更していない。

  - surface: "花王"
    pronunciation: "カオー"
    accent_type: 0
    word_type: "PROPER_NOUN"
    # 2026-09-01放送分で発覚: 助詞「の」に続く文脈（「花王のニュースです」）で
    # 「はなおう」と誤読されていた（「花王が」に続く文脈は元々正しく読めていた）。

  - surface: "最適化"
    pronunciation: "サイテキカ"
    accent_type: 0
    word_type: "COMMON_NOUN"
    # 2026-09-25発覚: 文脈に関わらず「パーソナライズ」と誤読されることが多い
    # （「最適化に力を入れています」「最適化アルゴリズムの改善」等で再現。
    # 一方「目的関数を最適化します」のように稀に正しく読めることもあり、
    # AIエンジン特有の不安定な誤読と見られる）。priority 8（既定）で直ることを
    # 実機確認済み。登録後、「最適」（「化」を伴わない単体）「最新」「適切」
    # 「化学」「デジタル化」「進化」「強化学習」はいずれも正しいまま
    # 読めることを実機確認済み。
    #
    # accent_type=0（平板）に修正（2026-09-25、実機再検証）。当初5で登録して
    # いたが、辞書登録なしで正しく読めている文脈（「目的関数を最適化します」）
    # のaudio_query結果がサイテキカガ(6)相当（accent==拍数＝このエンジンの
    # 平板の表し方）で、0で登録した場合と同じ形になることを実機確認済み。
    # 5（尾高寄り）だとこの自然な読みと形がズレる。

  - surface: "副次的"
    pronunciation: "フクジテキ"
    accent_type: 0
    word_type: "COMMON_NOUN"
    priority: 9
    # 2026-09-25発覚: 「次」エントリ（priority 8、"次"の文字を含む語すべてに
    # 影響しうる）が登録されていると、「副次的な副作用について」だけでなく
    # 「副次的な効果もある」のようにトリガー語（副作用等）が無い文脈でも
    # 「フクツギテキ」と誤読される（実機確認済み。旧コメントの「副次的な効果は
    # 元々正しく読めていた」は誤りだったため訂正。「次」エントリを一時的に
    # 削除するとどちらの文脈も正しく読めることを実機確認済み）。
    # 「副次的」をpriority 8で登録しても直らず、「次」より優先させるため
    # priority 9まで上げる必要があった（実機確認済み）。登録後、「次」側の
    # 「次官」「次期」「次男」「次いで」「目次」「次元」「次第」「順次」
    # 「次世代」「年次」「次回」「次々」「一次情報」「逐次」「取次」および
    # 「さて、次の」はいずれも正しいまま読めることを実機確認済み。
    #
    # accent_type=0（平板）に修正（2026-09-25、実機再検証）。当初5で登録して
    # いたが、「次」エントリを外した状態での自然な読み（フクジテキナコオカモ(7)
    # 等）と、「副次的だ」単独文脈（フクジテキダ、accent==拍数＝平板の表し方）が
    # いずれも0で登録した場合と同じ形になることを実機確認済み。

  - surface: "内製"
    pronunciation: "ナイセイ"
    accent_type: 0
    word_type: "COMMON_NOUN"
    priority: 5
    # 2026-09-25発覚: 「内製開発」「内製した」のように単独の文節として出現
    # すると「ウチセイ」と誤読される。「内製化」「自社内製」のように前後の
    # 漢字とくっついて1つの複合語として解析される場合は元々正しく読めていた。
    # priority 5（既定より低い値）で直ることを実機確認済み。登録後も
    # 「内製化」「内製率」「自社内製」はいずれも正しいまま読めることを
    # 実機確認済み。

  - surface: "一手間"
    pronunciation: "ヒトテマ"
    accent_type: 2
    word_type: "COMMON_NOUN"
    priority: 5
    # 2026-09-25発覚: 「一手間かける」「一手間加える」等で「イッテカン」と
    # 誤読される（「一」を音読み、「間」を「カン」と読んでしまう）。ひらがな
    # 表記の「ひと手間」は元々正しく読めていた。priority 5で直ることを実機
    # 確認済み。登録後、「手間」「一番」「一つ」「一体」「一人」「一部」
    # 「手を」「手法」「世間」「人間」「時間」「空間」「一瞬」（将棋の）
    # 「一手」はいずれも正しいまま読めることを実機確認済み。

  # 2026-09-25: 「目的」エントリ（過去にpriority 9で登録していた）は削除した。
  # 「役目的」「二つ目的」「控え目的」のように、他の語の送り仮名的な「〜的」
  # と隣接すると「目的」が優先解析されてヤクモクテキ等に誤読される巻き込みが
  # レビューで判明したため（tests/fixtures/reading_eval/dict_checks.json の
  # ヤクメテキ/フタツメテキ/ヒカエメテキで回帰確認）。「学習目的」のような
  # 文脈依存の誤読は、辞書の固定置換ではなく読み検証（reading_check.py）側で
  # 都度対処する方針にした。

  - surface: "緩すぎる"
    pronunciation: "ユルスギル"
    accent_type: 4
    word_type: "ADJECTIVE"
    priority: 5
    # 2026-09-25発覚: 「緩すぎる」がAIエンジンに「ナルスギル」と誤読される
    # （「緩い」「緩んで」「緩やか」「緩めて」等、他の活用形は元々正しく
    # 読めていた）。priority 5で直ることを実機確認済み。登録後、「緩い」
    # 「緩んで」「緩やか」「緩めて」、および他の形容詞+すぎるの形
    # （「多すぎる」「高すぎる」「熱すぎる」）はいずれも正しいまま読める
    # ことを実機確認済み。「緩すぎます」等、活用違いの形まではこの登録では
    # カバーしていない（実際に誤読が確認された「緩すぎる」の形のみ登録。
    # 「緩すぎます」は台本側で使わないよう留意するか、別途誤読が実際に
    # 発生した時点で追加検討する）。
    #
    # accent_type=4に修正（2026-09-25、実機再検証。当初0で登録していた）。
    # 辞書登録なしで正しく読める「多すぎる」「高すぎる」「熱すぎる」
    # 「長すぎる」はいずれも「すぎる」側（スギルト、拍2つ目の「ギ」）に
    # アクセント核があり、これは語幹の種類によらず一定だった。この核の
    # 位置を「緩すぎる」（ユ・ル・ス・ギ・ル、5拍）に当てはめるとaccent_type=4
    # （4拍目「ギ」の直後で核）になることを実機確認済み。0（平板）では
    # このアクセント核の位置と形が合わない。
