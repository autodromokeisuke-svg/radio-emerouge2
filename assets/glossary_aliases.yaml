# 用語の英語名・略称・カタカナ表記の揺れを同一視するための辞書。重複判定にのみ使う。
#
# 「今日のひとこと」が公開開始以降の放送で使った用語と同じか判定するとき
# （src/glossary_terms.py の find_duplicate）に、同じグループの表記を同じ用語として扱う。
# 台本生成AIへ渡す使用済み用語リストにも「別表記」として添える。番組の中身
# （台本の文章・口調）には一切影響しない。
#
# 書式: groups の下に、同じ用語の別表記を1グループ1行で並べる。各グループの先頭を
# 代表表記とする。比較は正規化（全角/半角・大文字小文字・ひらがな/カタカナ・中黒や
# スペースなどの記号・「エーアイ」と「AI」の違いを無視）してから行うので、そうした
# 違いだけの表記は書かなくてよい。1つの語が複数グループに現れた場合は和集合として扱う。
