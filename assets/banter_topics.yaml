# オープニングの「ふたりの日常のワンシーン」のお題リスト。
#
# src/write_script.py が放送日（JST）ごとに1つ選び、台本生成AIへ「今日の雑談のお題」として渡す。
# 日付で決まる番号順に1日1つ進み、最後まで行ったら先頭に戻る（お題の件数と同じ日数で一巡する）。
# お題の足し引きは自由。ただし個数を7の倍数にしないこと（7の倍数だと、同じお題が毎回
# 同じ曜日に来てしまう）。
#
# lead は話を振る人（eme / ruje）。エメとルジェが交互になるよう並べること。
# topic は必ずダブルクォートで囲む（「例: 」のコロンがあるとYAMLが壊れるため）。
# 「メッセージ」「連絡」を含むお題は入れないこと（マンネリ対策。tests/test_write_script.py が検査する）。
topics:
  - lead: ruje
    topic: "季節の変わり目に感じること（放送日の時期らしい話題で。その日の天気や気温は断定しない）"
  - lead: eme
    topic: "朝の頭の体操クイズを出す（ルジェがあっさり正解して、エメが悔しがる）"
  - lead: ruje
    topic: "通勤・通学の「あるある」（信号・渋滞・乗り換えなど）"
  - lead: eme
    topic: "ゆうべ見た不思議な夢の話（ルジェが冷静に分析してみる）"
  - lead: ruje
    topic: "ここ最近あった「小さないいこと」を報告し合う"
  - lead: eme
    topic: "身近なテクノロジー用語でしりとり（製品名・社名は使わない。数回で切り上げる）"
  - lead: ruje
    topic: "エメの良いところを急に褒めて、エメが照れる（いつもと立場が逆）"
  - lead: eme
    topic: "この季節に食べたくなるもの・やってみたいこと"
  - lead: ruje
    topic: "「もしも1日だけ別の仕事ができたら？」の空想トーク"
  - lead: eme
    topic: "今朝のちょっとした失敗（寝ぐせ・忘れ物など）を自分から白状する"
  - lead: ruje
    topic: "ルジェのほうからエメにちょっとした相談をする（エメが張り切って答える）"
  - lead: eme
    topic: "家電やスマホで最近「ちょっと困った」こと（ルジェが解決のコツを出す）"
  - lead: ruje
    topic: "放送日の曜日にちなんだ話（週の始まり・真ん中・終わりなど）"
  - lead: eme
    topic: "「今日のラッキーアイテム」を勝手に占う（ルジェがツッコむ）"
  - lead: ruje
    topic: "出発前のちょっとしたひと工夫（忘れ物チェック、シートやミラーの調整など）"
  - lead: eme
    topic: "お互いの「最近のマイブーム」を発表し合う"
  - lead: ruje
    topic: "エメの最近の口ぐせを指摘する（エメも言い返す）"
  - lead: eme
    topic: "未来にあったらいいなと思う道具の空想"
  - lead: ruje
    topic: "リスナーさん向けの「どっち派？」二択トーク（例: 朝はパン派かごはん派か）"
  - lead: eme
    topic: "連想ゲーム（ひとつのお題から3つずつ言い合う）"
  - lead: ruje
    topic: "身の回りで「これ便利になったな」と感じたこと（商品名は出さない）"
  - lead: eme
    topic: "今朝の朝ごはんを言い合う"
  - lead: ruje
    topic: "前の晩に準備しておくと朝が楽になること"
  - lead: eme
    topic: "ルジェの落ち着きぶりの「秘訣」を聞き出そうとする"
  - lead: ruje
    topic: "今の時期らしい行事や季節の楽しみ（特定の地域の催しや日程は断定しない）"
  - lead: eme
    topic: "休みの日にやりたいことの妄想プラン（ルジェが現実的にツッコむ）"
  - lead: ruje
    topic: "ちょっとした言い間違い・聞き間違いの話"
  - lead: eme
